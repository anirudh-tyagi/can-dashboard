services:
  engine_rpm:
    build:
      context: .
      dockerfile: nodes/engine_rpm/Dockerfile
    container_name: engine_rpm
    # vcan0 lives in the HOST network namespace. Without this the container gets
    # its own empty namespace and SIOCGIFINDEX fails with "No such device".
    network_mode: host
    restart: unless-stopped

  coolant_temp:
    build:
      context: .
      dockerfile: nodes/coolant_temp/Dockerfile
    container_name: coolant_temp
    network_mode: host
    restart: unless-stopped

  wheel_speed:
    build:
      context: .
      dockerfile: nodes/wheel_speed/Dockerfile
    container_name: wheel_speed
    network_mode: host
    restart: unless-stopped
